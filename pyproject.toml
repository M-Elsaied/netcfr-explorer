[project]
name = "netcfr-explorer"
version = "0.1.0"
description = "Local regret minimization on networks of zero-sum poker contests: simulations and results explorer"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["netcfr"]

[tool.hatch.build.targets.sdist]
include = ["netcfr", "tests", "experiments", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
